name: Build Mod Menu

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13   # 把這行從 macos-latest 改成 macos-13
    env:
      THEOS: ${{ github.workspace }}/theos

# ...下方的 steps 保持原樣不用動...

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Setup iOS SDKs
        run: |
          rm -rf $THEOS/sdks
          git clone https://github.com/theos/sdks.git $THEOS/sdks

      - name: Compile Dylib
        run: |
          make clean
          make FINALPACKAGE=1

      - name: Upload Output
        uses: actions/upload-artifact@v4
        with:
          name: ModMenu-Dylib
          path: |
            .theos/obj/**/*.dylib
            **/*.dylib
